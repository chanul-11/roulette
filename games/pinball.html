<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>핀볼 배틀로얄</title>
<meta name="theme-color" content="#2f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파티 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #111;
  color: #fff;
  font-family: -apple-system, "Malgun Gothic", sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}
.hidden { display: none !important; }
.screen { padding: 24px; max-width: 480px; margin: 0 auto; }
#participant-list { list-style: none; margin: 16px 0; }
#participant-list li { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.color-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
.color-dot-inline { display: inline-block; vertical-align: middle; margin-right: 8px; }
#participant-list input {
  flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 16px;
}
button {
  display: block; width: 100%; padding: 12px; margin-top: 8px;
  border: none; border-radius: 8px; background: #333; color: #fff; font-size: 16px;
}
button:disabled { opacity: 0.4; }
.remove-participant-btn {
  display: block; width: 32px; height: 32px; padding: 0; margin-top: 0;
  flex-shrink: 0; border-radius: 6px; background: #522; color: #fff;
  font-size: 20px; line-height: 1;
}
#game-screen { padding: 8px; }
#board-row {
  display: flex; align-items: stretch; justify-content: center;
  gap: 6px; width: 100%; max-width: 480px; margin: 0 auto;
}
#board-container { flex: 1; min-width: 0; }
#board-container canvas {
  display: block;
  width: 100% !important;
  height: auto !important;
  border-radius: 8px;
}
/* 미니맵은 보드 높이에 맞춘다(폰에서 보드는 줄어드는데 미니맵은 원래 높이로 남아 아래로 삐져나왔다). */
#minimap-container { width: 36px; flex-shrink: 0; position: relative; }
#minimap-container canvas {
  position: absolute; inset: 0;
  display: block;
  width: 100% !important;
  height: 100% !important;
  border-radius: 4px;
}
#setup-title { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.app-version { margin-top: 24px; text-align: center; color: #555; font-size: 12px; user-select: none; -webkit-user-select: none; }
.secret { margin-top: 12px; padding: 12px; border: 1px solid #333; border-radius: 8px; }
.secret-colors { display: flex; flex-wrap: wrap; gap: 8px; }
.secret-colors button {
  display: flex; align-items: center; gap: 6px; width: auto; margin-top: 0; padding: 8px 10px;
  background: #222; border: 2px solid transparent; font-size: 14px;
}
.secret-colors button.on { border-color: #fff; }
.secret-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; color: #bbb; }
#setup-screen { padding-top: 56px; }
#result-screen { text-align: center; padding-top: 80px; }
#result-text { font-size: 28px; margin-bottom: 24px; }

</style>
</head>
<body>
<a href="./" aria-label="게임 목록" style="position:fixed;z-index:50;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 8px);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(128,128,128,.22);color:inherit;text-decoration:none;font-size:24px;line-height:1;font-family:system-ui,sans-serif">‹</a>
  <div id="app">
    <section id="setup-screen" class="screen">
      <h1 id="setup-title">핀볼 배틀로얄</h1>
      <div id="secret-panel" class="secret hidden">
        <div id="secret-colors" class="secret-colors"></div>
        <label class="secret-row"><input type="checkbox" id="secret-once" checked> 이번 판만</label>
        <button type="button" id="secret-close">닫기</button>
      </div>
      <ul id="participant-list"></ul>
      <button id="add-participant-btn">참가자 추가</button>
      <button id="start-btn" disabled>시작</button>
      <p id="app-version" class="app-version">v1.2</p>
    </section>

    <section id="game-screen" class="screen hidden">
      <button id="drop-btn">낙하</button>
      <div id="board-row">
        <div id="board-container"></div>
        <div id="minimap-container"></div>
      </div>
    </section>

    <section id="result-screen" class="screen hidden">
      <h1 id="result-text"></h1>
      <button id="replay-btn">다시하기</button>
    </section>
  </div>

window.PinballApp = window.PinballApp || {};

window.PinballApp.COLOR_ORDER = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];

window.PinballApp.COLOR_HEX = {
  red: '#e53935',
  orange: '#fb8c00',
  yellow: '#fdd835',
  green: '#43a047',
  blue: '#1e88e5',
  purple: '#8e24aa',
};

window.PinballApp.COLOR_LABEL_KO = {
  red: '빨강',
  orange: '주황',
  yellow: '노랑',
  green: '초록',
  blue: '파랑',
  purple: '보라',
};

window.PinballApp.createColorDot = function createColorDot(color) {
  const dot = document.createElement('span');
  dot.className = 'color-dot';
  dot.style.background = window.PinballApp.COLOR_HEX[color];
  return dot;
};

window.PinballApp.showEl = function showEl(el) {
  el.classList.remove('hidden');
};

window.PinballApp.hideEl = function hideEl(el) {
  el.classList.add('hidden');
};

  <script>
// finishOrder: 탈락(바닥 통과) 순서대로 나열한 색 배열. 마지막 원소가 가장 늦게
// 탈락한(=당첨된) 공이다. 물리 시뮬레이션은 모든 공에게 완전히 같은 규칙을
// 적용하고, 결과가 원하는 조건과 맞는지는 여기서만 판정한다 — 조작은
// "결과를 고르는 것"뿐이고 물리 자체는 어떤 색도 봐주지 않는다.
//
// targetColor: 몰래 설정에서 고른 색. null이면 몰래 설정이 꺼진 것이라 어떤
// 결과든 그대로 받아들인다(진짜 무작위).
function isAcceptableFinish(finishOrder, targetColor) {
  if (finishOrder.length === 0) return false;
  if (!targetColor) return true;
  return finishOrder[finishOrder.length - 1] === targetColor;
}

// 목표 색이 다른 공이 아직 남아 있는데 먼저 빠졌다면, 그 판은 끝까지 계산할
// 필요 없이 바로 포기한다(헛계산을 크게 줄임).
function isDoomed(justFinishedColor, remainingCount, targetColor) {
  return !!targetColor && justFinishedColor === targetColor && remainingCount > 0;
}

// 몰래 설정 처리: 물리는 모든 공에게 똑같으므로, 한 판을 정상적으로 계산한 뒤
// "실제로 마지막에 남은 공"과 "목표 색 공"의 출발 자리와 궤적을 통째로 맞바꾸면
// 목표 색이 마지막에 남는 진짜 물리 기록이 된다. 출발 줄은 매 판 무작위로
// 섞이므로(board.js) 두 자리가 바뀐 것도 그냥 또 하나의 무작위 줄이다.
// 재계산이 없어서 몰래 설정을 켜도 준비 시간이 똑같다.
function relabelForTarget(lineup, trajectories, finishOrder, targetColor) {
  const lastColor = finishOrder[finishOrder.length - 1];
  if (!targetColor || !lastColor || lastColor === targetColor || !trajectories[targetColor]) {
    return { lineup, trajectories };
  }
  const slotT = lineup.findIndex((p) => p.color === targetColor);
  const slotL = lineup.findIndex((p) => p.color === lastColor);
  const newLineup = lineup.slice();
  newLineup[slotL] = lineup[slotT];
  newLineup[slotT] = lineup[slotL];
  const newTraj = { ...trajectories, [targetColor]: trajectories[lastColor], [lastColor]: trajectories[targetColor] };
  return { lineup: newLineup, trajectories: newTraj };
}

if (typeof window !== 'undefined') {
  window.PinballApp = window.PinballApp || {};
  window.PinballApp.isAcceptableFinish = isAcceptableFinish;
  window.PinballApp.isDoomed = isDoomed;
  window.PinballApp.relabelForTarget = relabelForTarget;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { isAcceptableFinish, isDoomed, relabelForTarget };
}

window.PinballApp = window.PinballApp || {};

window.PinballApp.initSetupScreen = function initSetupScreen(rootEl, onStart) {
  const { COLOR_ORDER, COLOR_LABEL_KO, createColorDot } = window.PinballApp;

  const listEl = rootEl.querySelector('#participant-list');
  const addBtn = rootEl.querySelector('#add-participant-btn');
  const startBtn = rootEl.querySelector('#start-btn');
  const titleEl = rootEl.querySelector('#setup-title');
  const secretPanel = rootEl.querySelector('#secret-panel');
  const secretColors = rootEl.querySelector('#secret-colors');
  const secretOnce = rootEl.querySelector('#secret-once');
  const versionEl = rootEl.querySelector('#app-version');

  // 몰래 설정: 제목을 1초 꾹 누르면 열린다. 고른 색의 공이 마지막에 남는(=당첨)
  // 판만 골라서 보여준다. 켜져 있는지는 맨 아래 버전 번호 끝(v1.2 → v1.2.1)으로만 보인다.
  let rigColor = null;
  function renderSecret() {
    if (rigColor && !participants.some((_, i) => COLOR_ORDER[i] === rigColor)) rigColor = null;
    secretColors.innerHTML = '';
    const off = document.createElement('button');
    off.type = 'button';
    off.textContent = '끄기';
    if (!rigColor) off.classList.add('on');
    off.addEventListener('click', () => { rigColor = null; renderSecret(); });
    secretColors.appendChild(off);
    participants.forEach((p, i) => {
      const color = COLOR_ORDER[i];
      const b = document.createElement('button');
      b.type = 'button';
      b.appendChild(createColorDot(color));
      b.appendChild(document.createTextNode(p.name.trim() || `참가자${i + 1}`));
      if (rigColor === color) b.classList.add('on');
      b.addEventListener('click', () => { rigColor = color; renderSecret(); });
      secretColors.appendChild(b);
    });
    versionEl.textContent = rigColor ? 'v1.2.1' : 'v1.2';
  }
  let pressTimer = null;
  titleEl.addEventListener('pointerdown', () => {
    pressTimer = setTimeout(() => { renderSecret(); secretPanel.classList.remove('hidden'); }, 900);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => titleEl.addEventListener(ev, () => clearTimeout(pressTimer)));
  titleEl.addEventListener('contextmenu', (e) => e.preventDefault());
  rootEl.querySelector('#secret-close').addEventListener('click', () => secretPanel.classList.add('hidden'));

  // participants only stores names — color is always derived from the
  // current index (COLOR_ORDER[i]), so deleting anyone automatically
  // shifts everyone after them down a color with no gaps.
  // 처음부터 2칸을 열어 둔다(0명이면 시작 버튼이 꺼져 있어 시작이 안 되는 줄 앎).
  let participants = [{ name: '' }, { name: '' }];

  function render() {
    listEl.innerHTML = '';
    participants.forEach((p, i) => {
      const color = COLOR_ORDER[i];
      const li = document.createElement('li');

      const dot = createColorDot(color);

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = `참가자${i + 1}`;
      input.value = p.name;
      input.addEventListener('input', (e) => {
        participants[i].name = e.target.value;
        updateStartButton();
        if (!secretPanel.classList.contains('hidden')) renderSecret();
      });

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove-participant-btn';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', '참가자 삭제');
      removeBtn.addEventListener('click', () => {
        participants.splice(i, 1);
        render();
      });

      li.appendChild(dot);
      li.appendChild(input);
      li.appendChild(removeBtn);
      listEl.appendChild(li);
    });

    addBtn.disabled = participants.length >= COLOR_ORDER.length;
    updateStartButton();
    renderSecret();
  }

  function updateStartButton() {
    // 이름을 비워 두면 "참가자N"으로 들어간다 — 2명 이상이면 바로 시작할 수 있다.
    startBtn.disabled = participants.length < 2;
  }

  addBtn.addEventListener('click', () => {
    if (participants.length >= COLOR_ORDER.length) return;
    participants.push({ name: '' });
    render();
  });

  startBtn.addEventListener('click', () => {
    if (startBtn.disabled) return;
    const target = rigColor;
    if (rigColor && secretOnce.checked) rigColor = null;
    secretPanel.classList.add('hidden');
    renderSecret();
    onStart(participants.map((p, i) => ({ name: p.name.trim() || `참가자${i + 1}`, color: COLOR_ORDER[i] })), target);
  });

  render();
};

window.PinballApp = window.PinballApp || {};

// ---------------------------------------------------------------------------
// 이 파일의 구조 (기존 "트랩도어" 방식에서 "미리 계산 후 재생" 방식으로 전환):
//
// 1) buildWorld(): 매번 새 Matter 엔진 + 장애물 + 공을 만든다. 색 구분 없이
//    완전히 동일한 몸체/규칙만 존재한다 — 규칙 자체에는 "빨강만 다르게"가
//    전혀 없다.
// 2) simulateOnce(): 화면에 그리지 않고 buildWorld()로 만든 세계를 최대한
//    빠르게(실시간 대기 없이) 끝까지 돌려서, 각 공이 몇 번째로 바닥에
//    닿았는지(탈락 순서)와 매 틱 위치를 통째로 기록한다.
// 3) findAcceptableRun(): simulateOnce()를 여러 번 반복해서, "목표 색이 마지막
//    으로 탈락"(elimination.js의 isAcceptableFinish, 몰래 설정이 켜졌을 때만 필수) + "재생 시간이
//    적당함" + "어떤 공도 일직선으로 심심하게 안 떨어짐"(품질 조건, 최선
//    노력)을 만족하는 결과를 고른다.
// 4) createGame(): 화면에는 그렇게 골라진 기록을 그대로 재생한다. 실제로
//    보이는 물리는 전부 진짜로 계산된 것이고(조작 없음), 다만 "그 결과가
//    나온 판만 골라서 보여준다"는 점만 다르다.
// ---------------------------------------------------------------------------

(function () {
  const { COLOR_HEX } = window.PinballApp;
  const { Engine, Render, Runner, Bodies, Composite, Body, Events, Constraint } = window.Matter;

  const WIDTH = 440;
  const VIEWPORT_HEIGHT = 640; // 화면에 항상 보이는 고정 크기 (카메라 창)
  const WORLD_HEIGHT = 10000; // 실제 보드 길이 (카메라가 이 안을 훑고 지나감) — 평균 1~1.5분 목표로 늘림
  const FLOOR_Y = WORLD_HEIGHT - 20;
  const LEFT_X = 120;
  const CENTER_X = WIDTH / 2;
  const RIGHT_X = WIDTH - LEFT_X;
  const MAX_BALL_SPEED = 15; // 범퍼가 반발력 1.4라 공진하면 속도가 무한정 커질 수 있어 상한을 둔다
  const STUCK_TIMEOUT_MS = 3000; // 이 시간 동안 바닥 쪽으로 전혀 못 내려가면 "진짜 갇힌 것"으로 보고 좌우로 살짝 흔든다
  const REST_SPEED_THRESHOLD = 0.4;
  const REST_TICKS_BEFORE_SETTLE = 18;
  const HURRY_START_MS = 60000;
  const HURRY_RAMP_MS = 15000;
  const HURRY_FORCE = 0.0004;
  const EARLY_HURRY_RAMP_MS = 20000;
  const EARLY_HURRY_FORCE = 0.0005;
  const FEW_BALLS_THRESHOLD = 3;
  const FEW_BALLS_HURRY_FORCE = 0.0012;
  const FEW_BALLS_RAMP_MS = 1500;
  const JITTER_FORCE = 0.00025;
  // 서두르는 힘이 순수하게 아래로만 작용하면 "일직선으로 쭉 빠지는" 것처럼
  // 보인다 — 그래서 서두르는 힘이 강해질수록 좌우 흔들림도 비례해서 같이
  // 세게 줘서, 급해도 옆으로 흔들리며 내려가게 한다.
  const HURRY_JITTER_RATIO = 0.5;
  const TICK_MS = 1000 / 60;

  const BUMPER_RADIUS = 14;
  const BUMPER_CLEARANCE = BUMPER_RADIUS + 5 + 6;
  const SPINNER_LENGTH = 70;
  const SPINNER_CLEARANCE = SPINNER_LENGTH / 2 + 4 + 5 + 6;
  const CROSS_ARM_LENGTH = 70;
  const CROSS_CLEARANCE = CROSS_ARM_LENGTH / 2 + 4 + 5 + 6;
  const MAGNET_MARKER_RADIUS = 16;
  // 자석을 한 줄에 3개(가로 간격 100px)씩 묶어서 배치하므로, 반경이 예전
  // 값(90)처럼 크면 옆 자석끼리 힘이 크게 겹쳐서 공이 여러 자석의 힘을
  // 동시에 받아 거의 빠져나오지 못하는 함정이 된다 — 그래서 겹침이 크지
  // 않도록 반경을 줄인다.
  const MAGNET_EFFECT_RADIUS = 45;
  const MAGNET_CLEARANCE = MAGNET_MARKER_RADIUS + 5 + 6;

  const BALL_SPAWN_Y = 30;
  const WALL_BUMP_RADIUS = 14;
  const WALL_BUMP_SPACING = 120;
  // 자석을 보드 중간에 하나씩 흩어놓는 대신, 전체 낙하 구간의 5분의 2 /
  // 5분의 4 지점 두 곳에 한꺼번에 여러 개(가로로 3개) 몰아서 배치한다.
  const MAGNET_CLUSTER_RATIOS = [2 / 5, 4 / 5];

  const ZONE_SPACING = 300;
  // 5단 십자 스피너 관문(GAUNTLET) 한 줄의 팔 길이는 CROSS_ARM_LENGTH(70) —
  // 인접한 줄의 세로 팔끼리 겹치지 않으려면 줄 간격이 그보다 확실히 커야
  // 한다(안 그러면 두 회전체가 서로 끼여 영원히 못 멈추는 공이 생긴다).
  // 그래서 GAUNTLET_ROW_SPACING(90) > CROSS_ARM_LENGTH(70)로 둔다.
  const FINALE_ZONE_HEIGHT = 650; // 마지막 깔때기 + 5단 십자 스피너 관문을 위해 예약
  const FUNNEL_Y = FLOOR_Y - 500;
  const FUNNEL_HALF_WIDTH = WIDTH / 2 - 20;
  const FUNNEL_DROP = 120;
  const FUNNEL_ANGLE = Math.atan2(FUNNEL_DROP, FUNNEL_HALF_WIDTH);
  // 실제로 재보니 target=18일 때 실측 틈은 23.14px였다 — 공 지름(24)과
  // 거의 같아서 사실상 못 지나가는 폭이었다(이번 세션 내내 반복된 "멈춤"
  // 버그의 진짜 원인). target=45로 재보정하면 실측 50.14px로 넉넉해진다.
  const FUNNEL_THROAT_TARGET = 45;
  const FUNNEL_DIAGONAL = Math.hypot(FUNNEL_HALF_WIDTH, FUNNEL_DROP);
  const FUNNEL_WALL_LENGTH = FUNNEL_DIAGONAL - (FUNNEL_THROAT_TARGET * FUNNEL_DIAGONAL) / FUNNEL_HALF_WIDTH;
  // 깔때기 목/5단 관문 구간은 원래부터 폭이 좁게 설계된 곳이라, 거길 지날
  // 때 좌우로 안 흔들리는 건 버그가 아니라 의도된 모습이다. 그래서
  // "일직선 낙하" 감지는 이 지점보다 위쪽(일반 페그 구간)만 검사한다.
  const FINALE_Y_START = FUNNEL_Y - FUNNEL_DROP - 30;
  const GAUNTLET_ROWS = 5; // 마지막 십자 스피너 관문 줄 수
  const GAUNTLET_ROW_SPACING = 90;
  const GAUNTLET_START_Y = FUNNEL_Y + 60;

  // 재시뮬레이션 탐색 설정. "목표 색이 마지막"인지는 그 공이 탈락하는 순간
  // 바로 판가름 나므로(다른 공이 남아있으면 즉시 이 시도를 포기), 대부분의
  // 실패 시도는 아주 빠르게 끝난다. 반면 시간/길이 조건까지 정확히 맞추려고
  // 계속 새로 돌리면 매번 끝까지(수천 틱) 계산해야 해서 너무 느려지므로,
  // 품질(길이/심심한 낙하 여부)은 정해진 실제 시간 예산 안에서만 개선을
  // 시도하고, 그 예산을 넘기면 그때까지 찾은 것 중 제일 나은 걸 바로 쓴다.
  const MAX_TICKS_PER_ATTEMPT = 8500; // 약 142초 — 이 안에 안 끝나면 그 판은 버리고 다시 시도
  const MIN_DURATION_SEC = 55;
  const MAX_DURATION_SEC = 95;
  const STRAIGHT_FALL_MIN_RANGE = 50; // 낙하 중 좌우로 이 정도도 안 흔들리면 "심심한 낙하"로 감점
  const STRAIGHT_FALL_WINDOW_TICKS = 90; // 약 1.5초 분량 구간에서 검사
  const STRAIGHT_FALL_MIN_Y_DROP = 200; // 이만큼 아래로 내려가는 동안 옆으로 안 흔들리면 감점 대상
  const QUALITY_SEARCH_BUDGET_MS = 1500; // 이미 하나 찾은 뒤, 더 나은 걸(일직선 낙하 없음 등) 찾는 데 쓸 최대 실제 시간
  const HARD_ATTEMPT_LIMIT = 2000; // 필수 조건(목표 색 마지막)조차 이 횟수 안에 못 찾으면 이상 상황 — 사실상 도달 안 함

  function buildWorld(participants) {
    const engine = Engine.create();
    engine.gravity.y = 1;

    const wallOptions = { isStatic: true, render: { fillStyle: '#0f0f1a' } };
    // 양옆 벽은 기본 반발력(0)이라, 벽을 따라 거의 수직으로 미끄러지는
    // 공은 부딪혀도 튕겨나갈 만한 옆 방향 속도 성분이 애초에 거의 없어서
    // 그냥 미끄러지듯 계속 내려간다. 벽 반발력을 크게 주면 아주 얕은
    // 각도로 스치기만 해도 그만큼 세게 옆으로 튕겨나가게 된다.
    const sideWallOptions = { ...wallOptions, restitution: 1.6 };
    const leftWall = Bodies.rectangle(-10, WORLD_HEIGHT / 2, 20, WORLD_HEIGHT, sideWallOptions);
    const rightWall = Bodies.rectangle(WIDTH + 10, WORLD_HEIGHT / 2, 20, WORLD_HEIGHT, sideWallOptions);
    const floor = Bodies.rectangle(WIDTH / 2, FLOOR_Y + 10, WIDTH, 20, { ...wallOptions, label: 'floor' });

    const bumperSpots = [];
    const spinnerSpecs = [];
    const crossSpinnerSpecs = [];
    const magnetSpots = [];

    let zoneY = 250;
    let zoneIndex = 0;
    while (zoneY < FLOOR_Y - FINALE_ZONE_HEIGHT) {
      const pattern = zoneIndex % 4;
      if (pattern === 0) {
        spinnerSpecs.push({ x: LEFT_X, y: zoneY, length: SPINNER_LENGTH, angularSpeed: 0.08, clearance: SPINNER_CLEARANCE });
      } else if (pattern === 1) {
        spinnerSpecs.push({ x: RIGHT_X, y: zoneY, length: SPINNER_LENGTH, angularSpeed: -0.08, clearance: SPINNER_CLEARANCE });
      } else if (pattern === 2) {
        bumperSpots.push({ x: LEFT_X, y: zoneY, clearance: BUMPER_CLEARANCE });
        bumperSpots.push({ x: RIGHT_X, y: zoneY, clearance: BUMPER_CLEARANCE });
      } else {
        crossSpinnerSpecs.push({
          x: CENTER_X,
          y: zoneY,
          armLength: CROSS_ARM_LENGTH,
          angularSpeed: zoneIndex % 2 === 0 ? 0.06 : -0.06,
          clearance: CROSS_CLEARANCE,
        });
      }
      if (zoneIndex % 2 === 0) {
        bumperSpots.push({ x: CENTER_X, y: zoneY + 150, clearance: BUMPER_CLEARANCE });
      }
      zoneIndex += 1;
      zoneY += ZONE_SPACING;
    }

    // 자석은 보드 곳곳에 하나씩 흩어놓지 않고, 전체 낙하 구간의 5분의 2 /
    // 5분의 4 지점 두 곳에 가로로 3개씩 몰아서 배치한다 — "자석 구간"이라는
    // 걸 뚜렷하게 느끼도록. 좌우로 인접한 자석끼리는 극성을 번갈아 둬서
    // 밀고 당기는 힘이 겹쳐서 더 복잡하게 움직이게 한다.
    const dropSpan = FLOOR_Y - BALL_SPAWN_Y;
    MAGNET_CLUSTER_RATIOS.forEach((ratio, clusterIndex) => {
      const clusterY = BALL_SPAWN_Y + dropSpan * ratio;
      [LEFT_X, CENTER_X, RIGHT_X].forEach((x, slotIndex) => {
        magnetSpots.push({
          x,
          y: clusterY,
          strength: (clusterIndex + slotIndex) % 2 === 0 ? 1 : -1,
          radius: MAGNET_EFFECT_RADIUS,
          clearance: MAGNET_CLEARANCE,
        });
      });
    });

    // 마지막 깔때기: 폭 전체를 덮어서 누구도 옆으로 못 지나가게 하고, 그
    // 아래에 십자 스피너 5줄을 연달아 배치해 마지막 순간을 길게 정신없게
    // 만든다.
    const funnelOptions = { isStatic: true, render: { fillStyle: '#ab47bc' } };
    const funnelWalls = [
      Bodies.rectangle(CENTER_X - FUNNEL_HALF_WIDTH / 2, FUNNEL_Y - FUNNEL_DROP / 2, FUNNEL_WALL_LENGTH, 10, {
        ...funnelOptions,
        angle: FUNNEL_ANGLE,
      }),
      Bodies.rectangle(CENTER_X + FUNNEL_HALF_WIDTH / 2, FUNNEL_Y - FUNNEL_DROP / 2, FUNNEL_WALL_LENGTH, 10, {
        ...funnelOptions,
        angle: -FUNNEL_ANGLE,
      }),
    ];
    for (let row = 0; row < GAUNTLET_ROWS; row++) {
      crossSpinnerSpecs.push({
        x: CENTER_X,
        y: GAUNTLET_START_Y + row * GAUNTLET_ROW_SPACING,
        armLength: CROSS_ARM_LENGTH,
        angularSpeed: row % 2 === 0 ? 0.1 : -0.1,
        clearance: CROSS_CLEARANCE,
      });
    }
    const FINALE_Y_END = GAUNTLET_START_Y + (GAUNTLET_ROWS - 1) * GAUNTLET_ROW_SPACING + 60;

    const bumpers = bumperSpots.map(({ x, y }) =>
      Bodies.circle(x, y, BUMPER_RADIUS, {
        isStatic: true,
        restitution: 1.4,
        render: { fillStyle: '#ffffff', strokeStyle: '#00e5ff', lineWidth: 3 },
      })
    );

    const magnets = magnetSpots.map(({ x, y, strength, radius }) => {
      const marker = Bodies.circle(x, y, MAGNET_MARKER_RADIUS, {
        isStatic: true,
        isSensor: true,
        render: {
          fillStyle: 'transparent',
          strokeStyle: strength > 0 ? '#ffffff' : '#9e9e9e',
          lineWidth: 3,
        },
      });
      return { marker, x, y, strength, radius };
    });

    const obstacleClearances = [...bumperSpots, ...spinnerSpecs, ...crossSpinnerSpecs, ...magnetSpots];
    const pegs = [];
    const rowSpacing = 60;
    const colSpacing = 40;
    const rows = Math.floor((FLOOR_Y - 200) / rowSpacing);
    // 통로(벽~첫 페그 틈)를 줄이면 40 기준으로는 안전하지만, 28 정도로
    // 살짝만 줄이면(공 지름 24보다 아주 조금만 좁은 틈) 끼임 없이 안전하면서
    // 검색 성공률도 더 좋다(40에서보다 성공 판을 더 잘 찾음) — 실측으로 확인.
    const PEG_WALL_MARGIN = 28;
    // 줄을 가운데 정렬한다. 예전엔 왼쪽 여백만 맞추고 오른쪽은 남는 대로 둬서
    // 오른쪽 벽 옆에 52~72px짜리 빈 통로가 생겼고, 공이 그 통로로 들어가 벽을
    // 타고 바닥까지 쭉 미끄러졌다(측정: 공이 시간의 36%를 벽 40px 안에서 보냄).
    for (let row = 0; row < rows; row++) {
      const margin = row % 2 === 0 ? PEG_WALL_MARGIN : PEG_WALL_MARGIN + colSpacing / 2;
      const cols = Math.floor((WIDTH - margin * 2) / colSpacing) + 1;
      const offsetX = (WIDTH - (cols - 1) * colSpacing) / 2;
      for (let col = 0; col < cols; col++) {
        const x = offsetX + col * colSpacing;
        const y = 100 + row * rowSpacing;
        const tooCloseToPoint = obstacleClearances.some((o) => Math.hypot(x - o.x, y - o.y) < o.clearance);
        const tooCloseToFunnel = y > FINALE_Y_START && y < FINALE_Y_END;
        if (tooCloseToPoint || tooCloseToFunnel) continue;
        pegs.push(Bodies.circle(x, y, 5, { isStatic: true, render: { fillStyle: '#e0e0e0' } }));
      }
    }

    // 벽 범프: 양쪽 벽에 WALL_BUMP_SPACING마다 반원 혹을 붙인다. 혹의 중심이 벽면
    // 위에 있어서, 벽에 붙어 내려오는 공(중심이 벽에서 12px 안쪽)은 항상 혹의
    // 안쪽 면에 맞고 가운데 쪽으로 튕겨 나간다 — 벽과 혹 사이에 공이 끼일
    // 주머니가 생기지 않는다. 좌우는 반 칸씩 엇갈려 배치한다.
    const wallBumps = [];
    for (let y = 200; y < FINALE_Y_START - 40; y += WALL_BUMP_SPACING) {
      [[0, 0], [WIDTH, WALL_BUMP_SPACING / 2]].forEach(([x, shift]) => {
        const by = y + shift;
        if (by >= FINALE_Y_START - 40) return;
        if (obstacleClearances.some((o) => Math.hypot(x - o.x, by - o.y) < o.clearance + WALL_BUMP_RADIUS)) return;
        wallBumps.push(Bodies.circle(x, by, WALL_BUMP_RADIUS, { isStatic: true, restitution: 0.9, render: { fillStyle: '#e0e0e0' } }));
      });
    }

    function createPinnedSpinner(x, y, bar, angularSpeed) {
      const pivot = Constraint.create({
        pointA: { x, y },
        bodyB: bar,
        pointB: { x: 0, y: 0 },
        length: 0,
        stiffness: 1,
        render: { visible: false },
      });
      return { bar, pivot, angularSpeed };
    }

    const spinners = spinnerSpecs.map(({ x, y, length, angularSpeed }) => {
      const bar = Bodies.rectangle(x, y, length, 8, {
        friction: 0.05,
        restitution: 0.6,
        render: { fillStyle: '#ff7043' },
      });
      return createPinnedSpinner(x, y, bar, angularSpeed);
    });

    const crossSpinners = crossSpinnerSpecs.map(({ x, y, armLength, angularSpeed }) => {
      const armOptions = { friction: 0.05, restitution: 0.6, render: { fillStyle: '#ff7043' } };
      const horizontalArm = Bodies.rectangle(x, y, armLength, 8, armOptions);
      const verticalArm = Bodies.rectangle(x, y, 8, armLength, armOptions);
      const cross = Body.create({ parts: [horizontalArm, verticalArm] });
      return createPinnedSpinner(x, y, cross, angularSpeed);
    });

    const allSpinners = [...spinners, ...crossSpinners];

    Events.on(engine, 'beforeUpdate', () => {
      allSpinners.forEach(({ bar, angularSpeed }) => Body.setAngularVelocity(bar, angularSpeed));
    });

    const spacing = WIDTH / (participants.length + 1);
    const balls = participants.map((p, i) => {
      const ball = Bodies.circle(spacing * (i + 1), BALL_SPAWN_Y, 12, {
        isStatic: true,
        restitution: 0.6,
        friction: 0.05,
        render: { fillStyle: COLOR_HEX[p.color] },
      });
      ball.gameColor = p.color;
      ball.gameName = p.name;
      ball.restTicks = 0;
      ball.maxY = ball.position.y;
      ball.lastProgressAt = null;
      return ball;
    });

    Composite.add(engine.world, [
      leftWall,
      rightWall,
      floor,
      ...pegs,
      ...wallBumps,
      ...bumpers,
      ...funnelWalls,
      ...allSpinners.map((s) => s.bar),
      ...allSpinners.map((s) => s.pivot),
      ...magnets.map((m) => m.marker),
      ...balls,
    ]);

    return { engine, balls, magnets, floor };
  }

  // 색 구분 없이 모든 공에 완전히 동일하게 적용되는 매 틱 규칙. 시뮬레이션과
  // 화면 재생 둘 다에서 쓰이진 않고 시뮬레이션에서만 쓰인다 — 재생 화면은
  // 이미 계산된 위치를 그대로 따라가기만 하면 되기 때문이다.
  function stepTick(world, state, now) {
    const { balls, magnets } = world;
    const { Body } = window.Matter;

    magnets.forEach(({ x, y, strength, radius }) => {
      state.liveBalls.forEach((ball) => {
        const dx = x - ball.position.x;
        const dy = y - ball.position.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 1 || dist > radius) return;
        const forceMag = 0.003 * strength * (1 - dist / radius);
        Body.applyForce(ball, ball.position, { x: (dx / dist) * forceMag, y: (dy / dist) * forceMag });
      });
    });

    Engine.update(world.engine, TICK_MS);

    if (state.fewBallsSince === null && state.liveBalls.length <= FEW_BALLS_THRESHOLD) {
      state.fewBallsSince = now;
    }

    state.liveBalls.slice().forEach((ball) => {
      const speed = Body.getSpeed(ball);
      if (speed > MAX_BALL_SPEED) {
        const scale = MAX_BALL_SPEED / speed;
        Body.setVelocity(ball, { x: ball.velocity.x * scale, y: ball.velocity.y * scale });
      }

      const nearFloor = ball.position.y > FLOOR_Y - 30;

      if (!nearFloor) {
        let hurryForce = 0;
        const elapsedSinceDrop = now;
        if (elapsedSinceDrop > HURRY_START_MS) {
          hurryForce = Math.max(hurryForce, HURRY_FORCE * Math.min(1, (elapsedSinceDrop - HURRY_START_MS) / HURRY_RAMP_MS));
        }
        if (state.firstSettleAt !== null) {
          hurryForce = Math.max(hurryForce, EARLY_HURRY_FORCE * Math.min(1, (now - state.firstSettleAt) / EARLY_HURRY_RAMP_MS));
        }
        if (state.fewBallsSince !== null) {
          hurryForce = Math.max(hurryForce, FEW_BALLS_HURRY_FORCE * Math.min(1, (now - state.fewBallsSince) / FEW_BALLS_RAMP_MS));
        }
        // 서두르는 힘이 강할수록 좌우 흔들림도 같이 세게 줘서, 급하게
        // 내려갈 때도 일직선이 아니라 옆으로 흔들리며 내려가게 한다.
        const sidewaysForce = JITTER_FORCE + hurryForce * HURRY_JITTER_RATIO;
        Body.applyForce(ball, ball.position, { x: (Math.random() - 0.5) * sidewaysForce, y: hurryForce });

        if (ball.lastProgressAt === null || ball.position.y > ball.maxY + 1) {
          ball.maxY = Math.max(ball.maxY, ball.position.y);
          ball.lastProgressAt = now;
        } else if (now - ball.lastProgressAt > STUCK_TIMEOUT_MS) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          Body.setVelocity(ball, { x: dir * (3.5 + Math.random() * 2), y: -(1.5 + Math.random() * 1.5) });
          ball.lastProgressAt = now;
        }
      }

      if (nearFloor && speed < REST_SPEED_THRESHOLD) {
        ball.restTicks += 1;
      } else {
        ball.restTicks = Math.max(0, ball.restTicks - 3);
      }

      // 색 구분 없이: 착지 판정이 나면 그냥 탈락. "빨강만 못 나간다" 같은
      // 규칙이 이제 물리 쪽엔 전혀 없다 — 결과가 마음에 드는지는 나중에
      // findAcceptableRun()에서만 확인한다.
      if (ball.restTicks >= REST_TICKS_BEFORE_SETTLE) {
        if (state.firstSettleAt === null) state.firstSettleAt = now;
        state.finishOrder.push(ball.gameColor);
        state.liveBalls = state.liveBalls.filter((b) => b !== ball);
        Composite.remove(world.engine.world, ball);
      }
    });
  }

  // 한 판 계산을 SIM_YIELD_TICKS틱마다 끊어서 돌려주는 제너레이터. 예전엔 한 판
  // (최대 수천 틱)을 통째로 돌린 뒤에야 화면에 양보해서, 느린 폰에서는 "게임
  // 준비 중" 동안 화면이 몇 초씩 굳어 시작이 안 되는 것처럼 보였다.
  const SIM_YIELD_TICKS = 120;
  function* simulateGen(participants, targetColor) {
    const world = buildWorld(participants);
    const state = { liveBalls: world.balls.slice(), finishOrder: [], fewBallsSince: null, firstSettleAt: null };

    world.balls.forEach((ball) => Body.setStatic(ball, false));

    const trajectories = {};
    participants.forEach((p) => {
      trajectories[p.color] = [];
    });

    // 목표 색(몰래 설정)이 남들보다 먼저 탈락하면 이 판은 조건을 못 맞춘다는
    // 게 그 순간 확정된다 — 끝까지 계산하지 않고 바로 포기한다.
    let tick = 0;
    let doomed = false;
    for (; tick < MAX_TICKS_PER_ATTEMPT && state.liveBalls.length > 0; tick++) {
      const now = tick * TICK_MS;
      const beforeCount = state.liveBalls.length;
      stepTick(world, state, now);
      if (state.liveBalls.length < beforeCount) {
        const justFinished = state.finishOrder[state.finishOrder.length - 1];
        if (window.PinballApp.isDoomed(justFinished, state.liveBalls.length, targetColor)) {
          doomed = true;
          break;
        }
      }
      state.liveBalls.forEach((ball) => {
        trajectories[ball.gameColor].push({ x: ball.position.x, y: ball.position.y });
      });
      if (tick % SIM_YIELD_TICKS === SIM_YIELD_TICKS - 1) yield;
    }

    return {
      success: !doomed && state.liveBalls.length === 0,
      finishOrder: state.finishOrder,
      trajectories,
      ticks: tick,
    };
  }

  function simulateOnce(participants, targetColor) {
    const gen = simulateGen(participants, targetColor);
    let r = gen.next();
    while (!r.done) r = gen.next();
    return r.value;
  }

  function scoreRun(result) {
    let penalty = 0;
    const durationSec = (result.ticks * TICK_MS) / 1000;
    if (durationSec < MIN_DURATION_SEC) penalty += (MIN_DURATION_SEC - durationSec) * 5;
    if (durationSec > MAX_DURATION_SEC) penalty += (durationSec - MAX_DURATION_SEC) * 5;
    if (hasAnyStraightFall(result)) penalty += 200;
    return penalty;
  }

  function hasAnyStraightFall(result) {
    return Object.keys(result.trajectories).some((color) => hasStraightFallSegment(result.trajectories[color]));
  }

  // 공의 전체 궤적 중 좌우로 거의 안 흔들리면서 세로로만 쭉 미끄러지는
  // 구간이 있는지 찾는다. 전체 궤적의 좌우 범위만 보면, 앞부분에서 많이
  // 튕기다가 뒷부분(특히 좌우 끝 페그가 성긴 구간)에서만 일직선으로
  // 떨어지는 경우를 놓친다 — 그래서 일정 구간(윈도우) 단위로 검사한다.
  function hasStraightFallSegment(traj) {
    const step = 15; // 0.25초 간격으로 윈도우를 옮겨가며 검사
    for (let start = 0; start + STRAIGHT_FALL_WINDOW_TICKS < traj.length; start += step) {
      const end = start + STRAIGHT_FALL_WINDOW_TICKS;
      if (traj[start].y >= FINALE_Y_START) break; // 이 뒤로는 전부 깔때기/관문 구간
      const yDrop = traj[end].y - traj[start].y;
      if (yDrop < STRAIGHT_FALL_MIN_Y_DROP) continue;
      let minX = Infinity;
      let maxX = -Infinity;
      for (let i = start; i <= end; i++) {
        minX = Math.min(minX, traj[i].x);
        maxX = Math.max(maxX, traj[i].x);
      }
      if (maxX - minX < STRAIGHT_FALL_MIN_RANGE) return true;
    }
    return false;
  }

  // 탐색을 한 번에 몰아서 돌리면 그동안 화면(브라우저 탭)이 완전히
  // 멈춰버린다 — 그래서 짧게(약 CHUNK_MS) 계산하고 setTimeout으로 한 번씩
  // 양보하는 걸 반복해서, 계산 중에도 "준비 중" 화면이 계속 그려지게 한다.
  // isCancelled()가 true를 반환하면(화면이 이미 닫힘) 남은 탐색을 그만둔다.
  const SEARCH_CHUNK_MS = 40;

  function findAcceptableRun(participants, targetColor, onDone, isCancelled) {
    const { isAcceptableFinish } = window.PinballApp;
    let best = null;
    let bestScore = Infinity;
    let attempts = 0;
    let qualityDeadline = null;
    let current = null; // 진행 중인 한 판 계산(제너레이터)

    function step() {
      if (isCancelled && isCancelled()) return;

      const chunkStart = Date.now();
      while (Date.now() - chunkStart < SEARCH_CHUNK_MS && attempts < HARD_ATTEMPT_LIMIT) {
        if (!current) {
          attempts += 1;
          current = simulateGen(participants, targetColor);
        }
        const r = current.next();
        if (!r.done) continue;
        current = null;
        const result = r.value;
        if (result.success && isAcceptableFinish(result.finishOrder, targetColor)) {
          const score = scoreRun(result);
          if (score < bestScore) {
            best = result;
            bestScore = score;
          }
          // 필수 조건(목표 색이 마지막, 꺼져 있으면 아무 결과)을 만족하는 결과를 하나라도 찾은 순간부터만
          // 정해진 실제 시간 예산 동안 더 나은 걸(일직선 낙하 없음, 재생
          // 시간 적당함) 찾아본다.
          if (qualityDeadline === null) {
            qualityDeadline = Date.now() + QUALITY_SEARCH_BUDGET_MS;
          }
        }
        if (bestScore === 0) break;
        if (qualityDeadline !== null && Date.now() >= qualityDeadline) break;
      }

      const doneSearching =
        bestScore === 0 ||
        attempts >= HARD_ATTEMPT_LIMIT ||
        (qualityDeadline !== null && Date.now() >= qualityDeadline);

      if (doneSearching) {
        onDone(best);
      } else {
        setTimeout(step, 0);
      }
    }

    step();
  }

  window.PinballApp._test = { findAcceptableRun, simulateOnce, buildWorld };

  // targetColor: 몰래 설정 색(없으면 null — 진짜 무작위).
  // 출발 줄은 매 판 무작위로 섞는다(입력 순서대로 서면 늘 같은 자리라 재미도 없다).
  // 탐색은 몰래 설정과 상관없이 똑같이 한 번만 하고, 켜져 있으면 결과가 나온 뒤
  // relabelForTarget()으로 목표 색과 실제 마지막 공의 자리·궤적을 맞바꾼다 —
  // 그래서 켜든 끄든 준비 시간이 같다.
  window.PinballApp.createGame = function createGame(containerEl, minimapEl, participants, targetColor, onGameEnd, onReady) {
    if (targetColor && !participants.some((p) => p.color === targetColor)) targetColor = null;
    const lineup = participants.slice();
    for (let i = lineup.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lineup[i], lineup[j]] = [lineup[j], lineup[i]];
    }
    let destroyed = false;
    const handle = {
      drop() {},
      destroy() {
        destroyed = true;
      },
    };

    function search() {
      findAcceptableRun(
        lineup,
        null,
        (run) => {
          if (destroyed) return;
          // HARD_ATTEMPT_LIMIT은 매우 넉넉하게 잡혀 있어 실전에서는 사실상
          // 도달하지 않지만, 혹시라도 못 찾았으면(운이 지독하게 나쁜
          // 경우) 화면을 띄우지 않고 그냥 처음부터 다시 찾는다.
          if (!run) {
            search();
            return;
          }
          const relabeled = window.PinballApp.relabelForTarget(lineup, run.trajectories, run.finishOrder, targetColor);
          const trajectories = relabeled.trajectories;

          const display = buildWorld(relabeled.lineup);
          const { engine, balls } = display;

          // 재생 화면에서는 공이 실제 물리에 반응하지 않고(isSensor) 매 틱
          // 기록된 위치로 그대로 옮겨진다 — 화면에 보이는 움직임은
          // findAcceptableRun()이 골라온, 실제로 계산됐던 물리 그대로다.
          balls.forEach((ball) => {
            Body.setStatic(ball, true);
            ball.isSensor = true;
          });

          const render = Render.create({
            element: containerEl,
            engine,
            options: { width: WIDTH, height: VIEWPORT_HEIGHT, wireframes: false, background: '#1a1a2e', hasBounds: true },
          });
          render.bounds = { min: { x: 0, y: 0 }, max: { x: WIDTH, y: VIEWPORT_HEIGHT } };

          const MINIMAP_WIDTH = 36;
          const minimapRender = Render.create({
            element: minimapEl,
            engine,
            options: { width: MINIMAP_WIDTH, height: VIEWPORT_HEIGHT, wireframes: false, background: '#1a1a2e', hasBounds: true },
          });
          minimapRender.bounds = { min: { x: 0, y: 0 }, max: { x: WIDTH, y: WORLD_HEIGHT } };
          Events.on(minimapRender, 'afterRender', () => {
            const ctx = minimapRender.context;
            const scaleY = VIEWPORT_HEIGHT / WORLD_HEIGHT;
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, render.bounds.min.y * scaleY, MINIMAP_WIDTH, (render.bounds.max.y - render.bounds.min.y) * scaleY);
          });

          const runner = Runner.create();
          Runner.run(runner, engine);
          Render.run(render);
          Render.run(minimapRender);

          let dropped = false;
          let ended = false;
          let replayTick = 0;
          let liveBalls = balls.slice();

          let cameraY = VIEWPORT_HEIGHT / 2;
          Events.on(render, 'beforeRender', () => {
            const half = VIEWPORT_HEIGHT / 2;
            let targetY = cameraY;
            if (dropped && liveBalls.length > 0) {
              targetY = liveBalls.reduce((maxY, b) => Math.max(maxY, b.position.y), 0);
            }
            cameraY += (targetY - cameraY) * 0.08;
            const center = Math.max(half, Math.min(WORLD_HEIGHT - half, cameraY));
            render.bounds.min.y = center - half;
            render.bounds.max.y = center + half;
          });

          Events.on(engine, 'afterUpdate', () => {
            if (!dropped || ended) return;
            replayTick += 1;

            liveBalls.slice().forEach((ball) => {
              const pos = trajectories[ball.gameColor][replayTick];
              if (pos) {
                Body.setPosition(ball, pos);
                return;
              }
              // 이 공의 기록이 끝났다 = 그 판에서 여기서 탈락했다.
              liveBalls = liveBalls.filter((b) => b !== ball);
              Composite.remove(engine.world, ball);
              if (liveBalls.length === 0) {
                ended = true;
                setTimeout(() => onGameEnd({ name: ball.gameName, color: ball.gameColor }), 0);
              }
            });
          });

          handle.drop = function drop() {
            dropped = true;
          };

          handle.destroy = function destroy() {
            Render.stop(render);
            Render.stop(minimapRender);
            Runner.stop(runner);
            Composite.clear(engine.world, false);
            Engine.clear(engine);
            render.canvas.remove();
            minimapRender.canvas.remove();
          };

          if (onReady) onReady();
        },
        () => destroyed
      );
    }

    search();

    return handle;
  };
})();

</script>
  <script>
window.PinballApp = window.PinballApp || {};

window.PinballApp.initResultScreen = function initResultScreen(rootEl, onReplay) {
  const { COLOR_LABEL_KO, createColorDot, showEl, hideEl } = window.PinballApp;
  const textEl = rootEl.querySelector('#result-text');
  const replayBtn = rootEl.querySelector('#replay-btn');

  replayBtn.addEventListener('click', () => {
    onReplay();
  });

  return {
    show(loser) {
      textEl.innerHTML = '';
      const dot = createColorDot(loser.color);
      dot.classList.add('color-dot-inline');
      textEl.appendChild(dot);
      textEl.appendChild(document.createTextNode(`${loser.name}님 당첨! (${COLOR_LABEL_KO[loser.color]})`));
      showEl(rootEl);
    },
    hide() {
      hideEl(rootEl);
    },
  };
};

</script>
  <script>
const { showEl, hideEl } = window.PinballApp;

const setupScreen = document.getElementById('setup-screen');
const gameScreen = document.getElementById('game-screen');
const resultScreen = document.getElementById('result-screen');
const boardContainer = document.getElementById('board-container');
const minimapContainer = document.getElementById('minimap-container');
const dropBtn = document.getElementById('drop-btn');

let currentGame = null;

const resultUI = window.PinballApp.initResultScreen(resultScreen, () => {
  resultUI.hide();
  hideEl(gameScreen);
  showEl(setupScreen);
});

window.PinballApp.initSetupScreen(setupScreen, (participants, targetColor) => {
  hideEl(setupScreen);
  showEl(gameScreen);

  dropBtn.disabled = true;
  // 준비(판 미리 계산) 동안 초를 세서 멈춘 게 아니라는 걸 보여준다.
  const prepStart = Date.now();
  const showPrep = () => { dropBtn.textContent = `게임 준비 중... ${Math.floor((Date.now() - prepStart) / 1000)}초`; };
  showPrep();
  const prepTimer = setInterval(showPrep, 500);

  currentGame = window.PinballApp.createGame(
    boardContainer,
    minimapContainer,
    participants,
    targetColor,
    (loser) => {
      clearInterval(prepTimer);
      currentGame.destroy();
      currentGame = null;
      hideEl(gameScreen);
      resultUI.show(loser);
    },
    () => {
      clearInterval(prepTimer);
      dropBtn.textContent = '낙하';
      dropBtn.disabled = false;
      dropBtn.addEventListener(
        'click',
        () => {
          dropBtn.disabled = true;
          currentGame.drop();
        },
        { once: true }
      );
    }
  );
});

</script>
